<link rel="stylesheet" href="./style.css"><!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>준우에게 💕</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body>

    <main class="container">


        <!-- 첫 번째 화면 -->
        <section class="screen active" id="screen1">

            <div
                class="envelope-wrapper"
                id="envelope"
            >

                <div class="envelope">

                    <div class="envelope-body"></div>

                    <div class="letter"></div>

                    <div class="envelope-flap"></div>

                </div>

            </div>


            <p class="small-text">
                안녕 준우얌? 내 마음이야 열어봐ㅎㅎ
            </p>

        </section>


        <!-- 두 번째 화면 -->
        <section class="screen" id="screen2">

            <h1>
                안녕?
            </h1>

            <button
                class="heart-button"
                id="heart1"
                aria-label="하트 열기"
            >
                ♥
            </button>


            <p class="small-text">
                하트를 눌러봐
            </p>

        </section>


        <!-- 세 번째 화면 -->
        <section class="screen" id="screen3">

            <h1>
                승희를 사랑하시나용?
            </h1>


            <div class="choice-buttons">

                <button
                    class="yes-button"
                    id="yesButton"
                >
                    응
                </button>


                <button
                    class="no-button"
                    id="noButton"
                >
                    아니
                </button>

            </div>

        </section>


        <!-- 네 번째 화면 -->
        <section class="screen" id="screen4">

            <h1>
                정말?!<br>
                나도 사랑해☺️😳
            </h1>


            <button
                class="heart-button"
                id="heart2"
                aria-label="마지막 편지 보기"
            >
                ♥
            </button>


            <p class="small-text">
                하트를 눌러봐
            </p>

        </section>


        <!-- 마지막 화면 -->
        <section class="screen" id="screen5">

            <div class="final-message">

                <h1>
                    준우야 💕
                </h1>


                <p>
                    그냥 요즘 사랑한다고 전하고 싶었어ㅎㅎ
                    <br><br>

                    항상 너무 고맙고 사랑해🫶
                    <br><br>

                    앞으로도 오래오래 행복하자♥
                    <br>

                    세상에서 젤 사랑해 준우야💕
                </p>


                <div class="big-heart">
                    ♥
                </div>

            </div>

        </section>


    </main>


    <script src="script.js"></script>


</body>

</html>
